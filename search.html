            padding:28px;

            border-radius:37px;

            border:2px solid rgba(230,255,255,0.3);

            box-shadow:0 10px 35px rgba(0,0,0,0.30);

            text-align:center;

            animation:fadeIn 1.2s ease;

            margin-top:20px;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .page-title{

            font-size:2.4rem;
            font-weight:800;

            color:#0d47a1;

            text-shadow:0 0 9px rgba(255,255,255,0.6);

            margin-bottom:6px;
        }

        .page-subtitle{

            font-size:1rem;

            color:#1a237e;

            margin-bottom:20px;
        }

        .search-area{

            display:flex;

            gap:10px;

            margin-bottom:24px;
        }

        .search-area input{

            flex:1;

            padding:14px 20px;

            border:none;
            outline:none;

            border-radius:16px;

            font-size:1rem;

            background:rgba(255,255,255,0.7);

            color:#0d47a1;

            box-shadow:inset 0 2px 6px rgba(0,0,0,0.08);

            transition:0.3s;
        }

        .search-area input::placeholder{
            color:#5c7a99;
        }

        .search-area input:focus{

            background:rgba(255,255,255,0.95);

            box-shadow:
                inset 0 2px 6px rgba(0,0,0,0.05),
                0 0 0 3px rgba(33,147,176,0.3);
        }

        .search-btn{

            padding:14px 22px;

            border:none;

            border-radius:16px;

            font-size:1rem;
            font-weight:600;

            color:white;

            cursor:pointer;

            background:linear-gradient(to right,#ff512f,#dd2476);

            transition:0.3s;
        }

        .search-btn:hover{

            transform:scale(1.05);

            box-shadow:0 6px 15px rgba(0,0,0,0.25);
        }

        .location-btn{

            display:block;

            width:100%;

            padding:14px;

            border:none;

            border-radius:16px;

            font-size:1rem;
            font-weight:600;

            color:white;

            cursor:pointer;

            background:linear-gradient(to right,#2193b0,#6dd5ed);

            transition:0.3s;

            margin-bottom:28px;
        }

        .location-btn:hover{

            transform:scale(1.03);

            box-shadow:0 6px 15px rgba(0,0,0,0.25);
        }

        .section-title{

            font-size:1.3rem;
            font-weight:700;

            color:#0d47a1;

            margin-bottom:14px;

            text-align:left;
        }

        .cities-grid{

            display:grid;

            grid-template-columns:repeat(2,1fr);

            gap:12px;

            margin-bottom:28px;
        }

        .city-card{

            padding:18px 10px;

            border-radius:18px;

            color:white;

            font-weight:600;

            cursor:pointer;

            transition:0.3s;

            text-align:center;
        }

        .city-card:hover{

            transform:translateY(-8px) scale(1.03);

            box-shadow:0 5px 15px rgba(0,0,0,0.25);
        }

        .city-emoji{

            font-size:2rem;

            display:block;

            margin-bottom:6px;
        }

        .city-name{
            font-size:1.1rem;
        }

        .city-temp{

            font-size:0.85rem;

            margin-top:4px;

            opacity:0.9;
        }

        .city-card:nth-child(1){
            background:linear-gradient(to bottom,#ffb347,#ffcc33);
            color:#5d4037;
        }

        .city-card:nth-child(2){
            background:linear-gradient(to bottom,#4facfe,#00f2fe);
        }

        .city-card:nth-child(3){
            background:linear-gradient(to bottom,#757f9a,#d7dde8);
            color:#263238;
        }

        .city-card:nth-child(4){
            background:linear-gradient(to bottom,#56ab2f,#a8e063);
            color:#1b5e20;
        }

        .city-card:nth-child(5){
            background:linear-gradient(to bottom,#ff9966,#ff5e62);
        }

        .city-card:nth-child(6){
            background:linear-gradient(to bottom,#43cea2,#185a9d);
        }

        .result-card{

            display:none;

            margin-bottom:24px;

            animation:slideUp 0.5s ease;
        }

        .result-card.show{
            display:block;
        }

        @keyframes slideUp{

            from{
                opacity:0;
                transform:translateY(18px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .result-city{

            font-size:2.6rem;
            font-weight:bold;

            color:#0d47a1;

            text-shadow:0 0 9px rgba(255,255,255,0.6);
        }

        .result-date{

            margin-top:6px;

            font-size:1rem;

            color:#1a237e;
        }

        .result-temp{

            margin-top:14px;

            font-size:5rem;
            font-weight:bold;

            color:#e65100;

            text-shadow:0 0 15px rgba(255,111,0,0.4);
        }

        .result-weather{

            font-size:1.8rem;
            font-weight:600;

            color:#d97a0d;

            animation:float 2s infinite ease-in-out;
        }

        @keyframes float{

            0%{
                transform:translateY(0);
            }

            50%{
                transform:translateY(-8px);
            }

            100%{
                transform:translateY(0);
            }
        }

        .result-message{

            margin-top:8px;

            font-size:1.1rem;
            font-weight:bold;

            color:#436338;
        }

        .result-details{

            margin-top:20px;

            display:flex;

            justify-content:space-between;

            gap:12px;
        }

        .detail-box{

            flex:1;

            padding:16px 8px;

            border-radius:18px;

            color:white;

            transition:0.3s;
        }

        .detail-box:hover{

            transform:translateY(-6px);

            box-shadow:0 6px 15px rgba(0,0,0,0.25);
        }

        .detail-box p{

            margin-top:6px;

            font-size:0.85rem;
        }

        .humidity{
            background:linear-gradient(to bottom,#00b3db,#0083b0);
        }

        .wind{
            background:linear-gradient(to bottom,#43cea2,#185a9d);
        }

        .feels{
            background:linear-gradient(to bottom,#ff9966,#ff5e62);
        }

        /* NEW FORECAST BUTTON */

        .forecast-btn{

            display:block;

            margin-top:22px;

            padding:14px;

            border-radius:16px;

            text-decoration:none;

            font-size:1rem;
            font-weight:600;

            color:white;

            background:linear-gradient(

                #7f53ac,
                #647dee
            );

            transition:0.3s;
        }

        .forecast-btn:hover{

            transform:scale(1.03);

            box-shadow:0 6px 15px rgba(0,0,0,0.25);
        }

        .close-result{

            margin-top:16px;

            padding:10px 24px;

            border:none;

            border-radius:14px;

            font-size:0.95rem;
            font-weight:600;

            color:#0d47a1;

            background:rgba(255,255,255,0.6);

            cursor:pointer;

            transition:0.3s;
        }

        .close-result:hover{
            background:rgba(255,255,255,0.9);
        }

        .status-msg{

            display:none;

            padding:14px;

            border-radius:14px;

            font-weight:600;

            margin-bottom:18px;
        }

        .status-msg.error{

            display:block;

            background:rgba(255,82,82,0.2);

            color:#c62828;
        }

        .status-msg.loading{

            display:block;

            background:rgba(33,147,176,0.15);

            color:#0d47a1;
        }

        .back-btn{

            display:block;

            margin-top:18px;

            padding:15px;

            border-radius:16px;

            text-decoration:none;

            font-size:1rem;
            font-weight:600;

            color:white;

            background:linear-gradient(to right,#2193b0,#6dd5ed);

            transition:0.3s;

            text-align:center;
        }

        .back-btn:hover{

            transform:scale(1.03);

            box-shadow:0 6px 15px rgba(0,0,0,0.25);
        }

        @media(max-width:480px){

            body{
                padding:12px;
            }

            .container{
                padding:20px;
            }

            .page-title{
                font-size:1.9rem;
            }

            .result-temp{
                font-size:4rem;
            }

            .result-details{
                flex-direction:column;
            }
        }

    </style>
</head>

<body>

        🔍 Search City
    </div>

    <div class="page-subtitle">
        Find weather for any city worldwide
    </div>

    <div class="search-area">

        <input
            type="text"
            id="searchInput"
            placeholder="Type a city name..."
        >

        <button class="search-btn" id="searchBtn">
            Search
        </button>

    </div>

    <div class="status-msg" id="statusMsg"></div>

    <!-- RESULT CARD -->

    <div class="result-card" id="resultCard">

        <div class="result-city" id="resultCity"></div>

        <div class="result-date" id="resultDate"></div>

        <div class="result-temp" id="resultTemp"></div>

        <div class="result-weather" id="resultWeather"></div>

        <div class="result-message" id="resultMessage"></div>

        <div class="result-details">

            <div class="detail-box humidity">

                💧

                <p>Humidity</p>

                <b id="resultHumidity"></b>

            </div>

            <div class="detail-box wind">

                🌬️

                <p>Wind</p>

                <b id="resultWind"></b>

            </div>

            <div class="detail-box feels">

                🌡️

                <p>Feels Like</p>

                <b id="resultFeels"></b>

            </div>

        </div>

        <!-- NEW BUTTON -->

        <a href="#" id="forecastBtn" class="forecast-btn">
            📅 View Full Forecast
        </a>

        <button class="close-result" id="closeResult">
            ✕ Close
        </button>

    </div>

    <button class="location-btn" id="locationBtn">
        📍 Use My Current Location
    </button>

    <div class="section-title">
        🌍 Popular Cities
    </div>

    <div class="cities-grid">

        <div class="city-card" onclick="searchCity('Mumbai')">

        </div>

        <div class="city-card" onclick="searchCity('Bangalore')">

            <span class="city-temp">27°C · Cloudy</span>

        </div>

        <div class="city-card" onclick="searchCity('Chennai')">

            <span class="city-emoji">🌊</span>

            <span class="city-name">Chennai</span>

            <span class="city-temp">34°C · Humid</span>

        </div>

        <div class="city-card" onclick="searchCity('Kolkata')">

    </div>

    <a href="index8.html" class="back-btn">
        🏠 Back to Home

</div>

const searchInput = document.getElementById("searchInput");

const searchBtn = document.getElementById("searchBtn");

const statusMsg = document.getElementById("statusMsg");

const resultCard = document.getElementById("resultCard");

const forecastBtn = document.getElementById("forecastBtn");

function getFormattedDate(){

    const days = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
    ];

    const months = [
        "Jan","Feb","Mar",
        "Apr","May","Jun",
        "Jul","Aug","Sep",
        "Oct","Nov","Dec"
    ];

    const now = new Date();

    return days[now.getDay()] +
        ", " +
        months[now.getMonth()] +
        " " +
        now.getDate();
}

function getGreeting(){

    const h = new Date().getHours();

    if(h < 12){
        return "Good Morning ☀️";
    }

    if(h < 18){
        return "Enjoy the Weather 🌤️";
    }

    return "Relaxing Evening 🌙";
}

function showStatus(text,type){

    statusMsg.textContent = text;

    statusMsg.className = "status-msg " + type;
}

function clearStatus(){

    statusMsg.className = "status-msg";
}

function searchCity(cityName){

    cityName = cityName.trim();

    if(!cityName){

        showStatus(
            "Please enter a city name!",
            "error"
        );

        return;
    }

    const key = cityName.toLowerCase();

    showStatus(
        "🔍 Searching for " + cityName + "...",
        "loading"
    );

    setTimeout(function(){

        clearStatus();

        const data = weatherDB[key];

        if(!data){

            showStatus(
                "❌ City not found!",
                "error"
            );

            return;
        }

        const displayName =
            cityName.charAt(0).toUpperCase() +
            cityName.slice(1);

        document.getElementById("resultCity").textContent =
            displayName;

        document.getElementById("resultDate").textContent =
            getFormattedDate();

        document.getElementById("resultTemp").textContent =
            data.temp + "°C";

        document.getElementById("resultWeather").textContent =
            data.emoji + " " + data.weather;

        document.getElementById("resultMessage").textContent =
            getGreeting();

        document.getElementById("resultHumidity").textContent =
            data.humidity + "%";

        document.getElementById("resultWind").textContent =
            data.wind + " km/h";

        document.getElementById("resultFeels").textContent =
            data.feels + "°C";

        /* NEW REDIRECT */

        forecastBtn.href =
            "forecasts_page.html?city=" +
            encodeURIComponent(displayName);

        resultCard.classList.remove("show");

        void resultCard.offsetWidth;

        resultCard.classList.add("show");

        resultCard.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

        searchInput.value = "";

    },600);
}

searchBtn.onclick = function(){

    searchCity(searchInput.value);
};

searchInput.onkeydown = function(e){

    if(e.key === "Enter"){

        searchCity(searchInput.value);
    }
};

document.getElementById("closeResult").onclick = function(){

    resultCard.classList.remove("show");
};

document.getElementById("locationBtn").onclick = function(){

    searchCity("Mumbai");
};

window.onload = function(){

    searchInput.focus();
};

</script>
